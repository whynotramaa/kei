# REFERENCE COPY for the host operator. NOT INSTALLED FROM THIS REPO.
#
# Install by hand as /opt/cueline/docker/nginx/cueline.conf and symlink it into
# sites-enabled, the same way orbya.conf is wired. No certificate work is needed
# because the orbyatravel.com certificate is a wildcard.
#
# READ THIS BEFORE COPYING THE ORBYA BLOCK INSTEAD:
# CueLine signals over a websocket. The standard Orbya proxy block has no
# Upgrade headers, and without them nginx answers the upgrade handshake with a
# 200, the room never pairs, and the page sits on "agent offline" forever. The
# three marked lines below are the whole difference.

upstream cueline_signal { server 127.0.0.1:3400; }

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cueline.orbyatravel.com;

    ssl_certificate     /etc/letsencrypt/live/orbyatravel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orbyatravel.com/privkey.pem;
    include             /opt/orbya/docker/nginx/ssl-params.conf;

    access_log /var/log/nginx/cueline.access.log;
    error_log  /var/log/nginx/cueline.error.log;

    location / {
        proxy_pass http://cueline_signal;

        proxy_http_version 1.1;                          # required for websockets
        proxy_set_header Upgrade $http_upgrade;          # required for websockets
        proxy_set_header Connection "upgrade";           # required for websockets

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # A paired room holds its socket open between cues. The 60 second
        # default would drop it and force a reconnect every minute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
