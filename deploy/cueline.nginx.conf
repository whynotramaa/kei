# CueLine signalling and host page. DOMAIN is replaced by deploy.sh.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    access_log /var/log/nginx/cueline.access.log;
    error_log  /var/log/nginx/cueline.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # The signalling channel is a websocket. Without these two headers
        # nginx answers the upgrade with a 200 and the room never pairs.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An idle room holds its socket open. The 60 second default closes it.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
