<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>CueLine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #08080a; --raise: #131317; --raise-2: #1b1b21;
    --line: rgba(255,255,255,.09); --line-strong: rgba(255,255,255,.18);
    --text: #f7f7f8; --dim: rgba(247,247,248,.52); --dimmer: rgba(247,247,248,.3);
    --sans: "Poppins", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html { height: 100%; }
  body {
    height: 100dvh; display: flex; flex-direction: column;
    color: var(--text); background: var(--ink);
    font: 400 14px/1.55 var(--sans);
    letter-spacing: -.005em; -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--mono); }
  .micro { font-size: 10px; text-transform: uppercase; letter-spacing: .16em; color: var(--dimmer); font-weight: 500; }

  /* ---------------------------------------------------------------- header */
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--line);
  }
  h1 {
    font-size: 15px; font-weight: 600; letter-spacing: -.02em;
    display: flex; align-items: center; gap: 9px; margin-right: 6px;
  }
  h1::before {
    content: ""; width: 15px; height: 15px; border-radius: 5px;
    background: var(--text);
  }
  #code {
    font-family: var(--mono);
    font-size: 16px; font-weight: 500; letter-spacing: .34em; text-indent: .34em;
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--raise); color: var(--text);
  }
  .pill {
    display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 10px;
    border: 1px solid var(--line); border-radius: 999px; font-size: 11.5px; color: var(--dim);
    background: var(--raise);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dimmer); flex: 0 0 auto; }
  .dot.on { background: var(--text); box-shadow: 0 0 0 3px rgba(255,255,255,.12); }
  .spacer { flex: 1; }
  #rtt { font-size: 10.5px; letter-spacing: .1em; }

  /* --------------------------------------------------------------- controls */
  button {
    font: 500 13px/1 var(--sans); cursor: pointer;
    color: var(--text); background: var(--raise); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 14px;
    transition: background .14s, border-color .14s, opacity .14s, transform .1s;
  }
  button:hover { background: var(--raise-2); border-color: var(--line-strong); }
  button:active { transform: translateY(1px); }
  button.primary {
    background: var(--text); color: var(--ink); border-color: var(--text); font-weight: 600;
  }
  button.primary:hover { opacity: .88; background: var(--text); }
  button:disabled { opacity: .38; cursor: default; transform: none; }
  input {
    font: 400 14px/1.4 var(--sans); color: var(--text); background: var(--raise);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px;
    transition: border-color .14s, background .14s;
  }
  input::placeholder { color: var(--dimmer); }
  input:focus { outline: none; border-color: var(--line-strong); background: var(--raise-2); }
  input:focus-visible, button:focus-visible { outline: 1px solid var(--text); outline-offset: 2px; }

  /* ---------------------------------------------------------------- layout */
  main { display: flex; flex: 1; min-height: 0; }
  #mixer {
    width: 288px; flex: 0 0 auto; border-right: 1px solid var(--line);
    padding: 22px; display: flex; flex-direction: column;
  }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #mixer { width: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px 18px; }
    .hint { margin-top: 14px !important; }
  }
  .track {
    padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--raise);
  }
  .track + .track { margin-top: 12px; }
  .track > .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .track .state { font-size: 11px; color: var(--dimmer); font-family: var(--mono); }
  .meter { height: 4px; background: var(--raise-2); border-radius: 999px; overflow: hidden; }
  .meter > i {
    display: block; height: 100%; width: 0; border-radius: 999px;
    background: var(--text); transition: width .06s linear;
  }
  input[type=range] {
    width: 100%; margin: 14px 0 0; padding: 0; height: 16px;
    accent-color: var(--text); background: transparent; border: 0; border-radius: 0;
  }
  input[type=range]:focus { background: transparent; }
  .hint { font-size: 11.5px; color: var(--dimmer); margin-top: auto; padding-top: 20px; line-height: 1.7; }

  /* ------------------------------------------------------------------- log */
  #right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log {
    flex: 1; overflow-y: auto; padding: 22px;
    display: flex; flex-direction: column; gap: 10px; justify-content: flex-end;
  }
  .cue {
    align-self: flex-end; max-width: 76%; background: var(--text); color: var(--ink);
    padding: 9px 14px; border-radius: 14px 14px 4px 14px;
    overflow-wrap: anywhere; font-weight: 500; letter-spacing: -.01em;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
    animation: rise .16s ease-out;
  }
  .sys {
    align-self: center; font-size: 11px; color: var(--dimmer); font-family: var(--mono);
    padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px;
  }
  @keyframes rise { from { transform: translateY(4px); opacity: 0 } to { transform: none; opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .cue { animation: none } }

  form {
    display: flex; gap: 10px; align-items: center; padding: 16px 22px 20px;
    border-top: 1px solid var(--line);
  }
  form input {
    flex: 1; font-size: 15px; padding: 16px 20px; border-radius: 16px;
  }
  form button { padding: 15px 22px; border-radius: 16px; font-size: 14px; }
</style>

<header>
  <h1>CueLine</h1>
  <span id="code" class="mono">------</span>
  <button id="newcode">New</button>
  <span class="pill"><span class="dot" id="dot"></span><span id="presence">agent offline</span></span>
  <span class="spacer"></span>
  <span class="micro mono" id="rtt"></span>
  <button id="speakers" class="primary">Enable speakers</button>
</header>

<main>
  <section id="mixer">
    <div class="track">
      <div class="head"><span class="micro">Microphone</span><span class="state" id="mic-state">no signal</span></div>
      <div class="meter"><i id="mic-meter"></i></div>
      <input type="range" id="mic-gain" min="0" max="2" step="0.01" value="1" aria-label="Microphone volume">
    </div>
    <div class="track">
      <div class="head"><span class="micro">System audio</span><span class="state" id="sys-state">no signal</span></div>
      <div class="meter"><i id="sys-meter"></i></div>
      <input type="range" id="sys-gain" min="0" max="2" step="0.01" value="1" aria-label="System audio volume">
    </div>
    <p class="hint">Audio runs one way. The agent never hears you and never plays a sound.</p>
  </section>

  <section id="right">
    <div id="log"></div>
    <form id="whisper" autocomplete="off">
      <input id="cue" placeholder="Type a cue, press Enter" maxlength="200" autofocus>
      <button class="primary">Send</button>
    </form>
  </section>
</main>

<script type="module" src="./host.js"></script>
