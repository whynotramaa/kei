name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Cheapest guard against shipping a file that will not parse.
      - name: Check syntax
        run: |
          node --check server/index.js
          node --check server/public/host.js

      # The default builder uses the docker driver, which cannot export a GHA
      # cache. This creates a docker-container builder, which can.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build here, never on the VPS. That box has 16 GB shared across projects
      # and a build there can OOM-kill someone else's live containers.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # Project-prefixed. A bare "signal" would collide with another project.
          tags: ghcr.io/whynotramaa/cueline-signal:${{ github.sha }}
          cache-from: type=gha,scope=signal
          cache-to: type=gha,mode=max,scope=signal

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Put a required reviewer on this environment. A push to main runs as root
    # on a shared VPS, so a stolen push should still need a human click.
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$VPS_KEY" > key && chmod 600 key
          ssh -o StrictHostKeyChecking=accept-new -i key "$VPS_USER@$VPS_HOST" \
            IMAGE_TAG="$IMAGE_TAG" GHCR_TOKEN="$GHCR_TOKEN" GHCR_USER="$GHCR_USER" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/cueline
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          export IMAGE_TAG
          DC="docker compose -p cueline -f docker/docker-compose.prod.yml --env-file .env.prod"
          $DC pull
          $DC up -d --remove-orphans
          sleep 3
          $DC ps
          # Fail the build rather than report a green deploy over a dead service.
          curl -fsS http://127.0.0.1:3400/config.json > /dev/null
          echo "cueline-signal is serving $IMAGE_TAG"
          # Dangling images only. Never prune -a on a shared host.
          docker image prune -f > /dev/null
          REMOTE
